# 灵魂绑定配置
# 所有文本均为中文，文件编码请保持 UTF-8。
# 前缀、GUI 标题、Lore 模板等外显文案可在 messages.yml 中客制化。

binding:
  # 每名玩家最多可绑定的物品数量。
  max-per-player: 20
  # 新绑定物品是否默认启用“不可离包”。启用后会阻止丢弃、放入容器、死亡掉落等行为。
  default-locked: false
  # 是否启用绑定材料白名单。开启后，只有 whitelist 中列出的材料可以绑定。
  whitelist-enabled: false
  # 绑定材料白名单，填写 Bukkit Material 名称；默认关闭。
  whitelist: []
  # 绑定材料黑名单，始终禁止绑定这些高风险或管理类物品。
  blacklist:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - DEBUG_STICK
    - KNOWLEDGE_BOOK
  # 自动轻量扫描间隔，单位：tick。轻量扫描只分批校验已知位置；深度全服扫描请使用管理员维护。
  scan-interval-ticks: 1200
  # 自动轻量扫描每轮最多校验的绑定记录数。数值越大单次主线程压力越高。
  scan-records-per-run: 64
  # 自动轻量扫描单轮主线程时间预算，单位：毫秒。超过预算后剩余记录会留到下轮继续。
  scan-time-budget-ms: 10
  # 管理员一键维护的全服安全扫描每轮最多处理多少条记录，分批执行以降低 TPS 波动。
  manual-scan-records-per-run: 32
  # 管理员一键维护的全服安全扫描分批间隔，单位：tick。
  manual-scan-interval-ticks: 5
  # 单次同步深度扫描最多处理多少条记录；0 表示不限制。用于防止聊天命令或旧入口一次性扫描过多记录。
  manual-scan-max-records: 512

database:
  # 绑定记录数据库文件。默认保存在插件目录下；也可以填写绝对路径。
  # 首次启用数据库版时，如果旧 data.yml 存在且数据库为空，会自动迁移旧绑定记录。
  sqlite-file: "binder.db"
  # 数据库保存采用记录级增量写入：普通扫描只写发生变化的记录，停服和备份前仍会完整落盘。
  # 普通位置更新会先合并到队列中，延迟少量 tick 后分批写入，减少高频背包事件造成的主线程磁盘波动。
  dirty-flush-delay-ticks: 40
  # 单次队列落盘最多写入多少条变更记录；剩余内容会继续排队到下一轮，降低瞬时卡顿。
  dirty-flush-max-records-per-run: 64
  # SQLite 等待数据库锁释放的最长时间，单位：毫秒。服务器较卡或备份较频繁时可适当调高。
  busy-timeout-ms: 5000
  # SQLite 同步模式。NORMAL 兼顾性能和安全；如需更保守可改为 FULL。
  synchronous: "NORMAL"
  # SQLite 临时数据存放位置。MEMORY 可减少临时磁盘写入。
  temp-store: "MEMORY"
  # WAL 自动检查点页数。数值越小 WAL 文件越不容易变大；0 表示关闭自动检查点。
  wal-autocheckpoint-pages: 1000

backup:
  # 是否启用数据库自动备份。关闭后只保留管理员 GUI 的手动备份。
  enabled: true
  # 新备份统一保存到插件目录的 Backup 文件夹；每次备份都会创建一个独立子文件夹。
  # 子文件夹内会包含 binder.db 和 备份信息.yml，备份信息会记录备份时间与数据库实际文件时间。
  # 自动保留最近多少个新版备份文件夹；旧版 backups 目录中的散落备份不会被自动删除。
  keep-latest: 48
  schedule:
    # 是否启用定时数据库备份。
    enabled: true
    # 插件启动后延迟多少分钟执行第一次定时备份。
    initial-delay-minutes: 10
    # 定时备份间隔，单位：分钟。
    interval-minutes: 360
    # 定时备份是否同时备份配置、消息、提醒偏好和隔离记录。
    include-optional-files: true
  event:
    # 是否启用事件触发备份；绑定、解绑、改绑定者、批量保护、隔离重复物等关键事件后会触发。
    enabled: true
    # 事件备份冷却，单位：秒。多个事件会合并为一次备份，避免频繁磁盘 IO。
    cooldown-seconds: 300
    # 事件备份默认只备份 SQLite 主库；如需每次事件也备份配置文件可开启。
    include-optional-files: false

recall:
  # 普通召回价格：原物品仍可定位时，从容器、掉落物或他人背包等位置安全召回的费用。0 表示免费。
  normal-cost: 0.0
  # 丢失召回价格：仅在无法定位原物品且通过安全判定后使用，需要 Vault 和经济插件。
  lost-cost: 5000.0
  # 玩家成功召回后的冷却时间，单位：秒。0 表示无冷却。
  cooldown-seconds: 0

economy:
  # 绑定主手物品的费用。0 表示免费。
  bind-cost: 1000.0
  # 玩家解除自己绑定的费用。管理员解除不收费。0 表示免费。
  unbind-cost: 0.0

alerts:
  # 是否启用绑定物状态提醒。
  enabled: true
  # 同一件绑定物、同一类提醒的冷却时间，单位：秒。用于避免其他玩家连续点击时刷屏。
  cooldown-seconds: 5
  # 绑定物变成掉落物并落到世界中时提醒绑定者。
  drop: true
  # 绑定物被其他玩家捡起时提醒绑定者。
  pickup: true
  # 绑定物被其他玩家点击、拖动、放入展示框、操作盔甲架、尝试使用等行为影响时提醒绑定者。
  operation: true

coreprotect:
  # 是否接入 CoreProtect API 查询容器记录，用作定位候选线索。
  enabled: true
  # 是否输出 CoreProtect 相关调试日志。默认关闭，CoreProtect 接入、查询、跳过和异常都不会刷屏。
  debug-logging: false
  # GUI 刷新位置时是否使用 CoreProtect 候选查询。关闭后 GUI 只显示插件自身当前能扫描到的位置。
  use-in-display-scan: true
  # 手动深度全服扫描中是否使用 CoreProtect 候选查询。自动轻量扫描不会查询 CoreProtect，避免长期占用主线程。
  use-in-auto-scan: true
  # 当最后记录是玩家背包、临时界面或已丢失时，是否以在线绑定者当前位置作为 CoreProtect 查询起点。
  use-online-owner-origin: true
  # 当最后记录中有持有者且该玩家在线时，是否以该持有者当前位置作为 CoreProtect 查询起点。
  use-online-holder-origin: true
  # 向前查询 CoreProtect 容器记录的时间范围，单位：秒。默认 7 天。
  lookup-time-seconds: 604800
  # 以插件记录位置、在线绑定者或最后持有者为中心的查询半径。CoreProtect 只提供候选容器，最终仍会扫描真实库存中的绑定 UUID。
  lookup-radius: 128
  # 单次最多读取的 CoreProtect 记录数量。数值越大越可能找到旧记录，但查询耗时也可能增加。
  lookup-limit: 200
  # 单次扫描操作最多对多少条绑定记录发起 CoreProtect 查询；超出部分下次继续，避免 CoreProtect 查询造成主线程尖峰。
  max-record-queries-per-operation: 8
  # 是否同时读取容器移除记录作为候选位置。开启后更容易追踪漏斗链路或多次转移；不会仅凭移除记录生成物品。
  include-container-removals: true
  # 插件从容器移除绑定物时，是否向 CoreProtect 写入容器交易记录。
  log-plugin-transactions: true

sounds:
  # 是否启用插件音效。旧配置缺少本段时，插件会自动使用内置默认音效。
  enabled: true
  gui:
    # 打开 GUI 页面时播放的音效。
    open:
      sound: BLOCK_CHEST_OPEN
      volume: 0.6
      pitch: 1.0
    # 点击普通 GUI 按钮或空位时播放的音效。
    click:
      sound: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.0
    # 点击翻页按钮时播放的音效。
    page:
      sound: ITEM_BOOK_PAGE_TURN
      volume: 0.6
      pitch: 1.25
    # 返回上一页或返回主菜单时播放的音效。
    back:
      sound: BLOCK_CHEST_CLOSE
      volume: 0.6
      pitch: 0.75
    # 打开二次确认页面时播放的音效。
    confirm-open:
      sound: BLOCK_NOTE_BLOCK_PLING
      volume: 0.6
      pitch: 1.35
    # 点击确认召回或确认敏感操作时播放的音效。
    confirm:
      sound: ENTITY_EXPERIENCE_ORB_PICKUP
      volume: 0.6
      pitch: 1.2
    # 点击取消按钮时播放的音效。
    cancel:
      sound: BLOCK_CHEST_CLOSE
      volume: 0.6
      pitch: 0.75
    # 打开详情页或选择列表项时播放的音效。
    detail:
      sound: BLOCK_NOTE_BLOCK_HAT
      volume: 0.6
      pitch: 1.0
    # 打开管理员入口或管理列表时播放的音效。
    admin:
      sound: BLOCK_NOTE_BLOCK_BASS
      volume: 0.6
      pitch: 0.75
    # 点击“绑定主手物品”按钮时播放的音效。
    bind:
      sound: BLOCK_ENCHANTMENT_TABLE_USE
      volume: 0.6
      pitch: 1.0
    # 点击召回按钮或列表左键召回时播放的音效。
    recall-select:
      sound: ENTITY_ENDER_PEARL_THROW
      volume: 0.6
      pitch: 1.0
    # 切换“不可离包”状态时播放的音效。
    toggle:
      sound: BLOCK_LEVER_CLICK
      volume: 0.6
      pitch: 1.2
    # 重新扫描或刷新 GUI 页面时播放的音效。
    refresh:
      sound: BLOCK_NOTE_BLOCK_BIT
      volume: 0.6
      pitch: 1.2
    # 管理员重载配置时播放的音效。
    reload:
      sound: BLOCK_NOTE_BLOCK_CHIME
      volume: 0.6
      pitch: 1.2
    # 选择新绑定者时播放的音效。
    owner-select:
      sound: ENTITY_PLAYER_ATTACK_NODAMAGE
      volume: 0.6
      pitch: 1.0
    # 打开插件统计页面时播放的音效。
    stats:
      sound: BLOCK_NOTE_BLOCK_XYLOPHONE
      volume: 0.6
      pitch: 1.0
    # 手动备份数据时播放的音效。
    backup:
      sound: BLOCK_NOTE_BLOCK_CHIME
      volume: 0.6
      pitch: 1.2
    # 手动执行全服安全扫描时播放的音效。
    scan:
      sound: BLOCK_BEACON_ACTIVATE
      volume: 0.6
      pitch: 1.1
    # 点击无效或无权限按钮时播放的音效。
    disabled:
      sound: BLOCK_NOTE_BLOCK_DIDGERIDOO
      volume: 0.5
      pitch: 0.75
  alert:
    # 绑定物落地提醒音效。
    drop:
      sound: ENTITY_ITEM_PICKUP
      volume: 0.6
      pitch: 1.0
    # 绑定物被其他玩家捡起提醒音效。
    pickup:
      sound: BLOCK_NOTE_BLOCK_PLING
      volume: 0.6
      pitch: 1.3
    # 绑定物被其他玩家操作提醒音效。
    operation:
      sound: BLOCK_NOTE_BLOCK_BELL
      volume: 0.6
      pitch: 1.3
  # 绑定、召回、解除绑定等成功时播放的音效。
  success:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.7
    pitch: 1.2
  # 操作失败或被安全机制拒绝时播放的音效。
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 0.8
    pitch: 0.75
